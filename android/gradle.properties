org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Default F-Droid repository the store points at. Override with -Papslop.repoUrl=https://...
apslop.repoUrl=http://10.0.2.2:8080/fdroid/repo

# Keep resource file names in release builds (R8 shortens them to res/BW.xml etc.). fdroidserver finds
# the app icon by its file name (res/mipmap-*/ic_launcher.png), so shortened names leave the store
# listing without an icon.
android.enableResourceOptimizations=false
