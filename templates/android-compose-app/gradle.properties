org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# App version. CI overrides these via OPENAP_VERSION_CODE / OPENAP_VERSION_NAME from the git tag.
VERSION_CODE=1
VERSION_NAME=0.1.0

# Keep original resource paths (res/mipmap-*/ic_launcher.png): the OpenAP store (fdroidserver) reads launcher icons by path.
android.enableResourceOptimizations=false
