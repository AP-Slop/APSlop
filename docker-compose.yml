services:
  web:
    build: ./web
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - web-data:/app/data
    depends_on:
      store-server:
        condition: service_healthy

  store-server:
    build: ./store-server
    env_file: .env
    ports:
      # ホスト側ポートは STORE_PORT で変更可 (既定 8080)。変更時は STORE_PUBLIC_URL / NEXT_PUBLIC_STORE_URL も合わせる
      - "${STORE_PORT:-8080}:8080"
    volumes:
      - store-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  web-data:
  store-data:
